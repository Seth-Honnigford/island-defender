<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirit Island Test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Invader card track: pinned top-left -->
  <div id="invader-track">
    <div class="invader-slot">
      <div class="slot-label">EXPLORE</div>
      <div class="deck-card" id="deck-visual">
        <div class="deck-count" id="deck-count-badge">0</div>
      </div>
    </div>
    <div class="track-arrow">&#8595;</div>
    <div class="invader-slot">
      <div class="slot-label">BUILD</div>
      <div id="build-slot-visual" class="card-placeholder">Empty</div>
    </div>
    <div class="track-arrow">&#8595;</div>
    <div class="invader-slot">
      <div class="slot-label">RAVAGE</div>
      <div id="ravage-slot-visual" class="card-placeholder">Empty</div>
    </div>
  </div>

  <div id="phase-track"></div>
  <div id="board-wrapper">
    <div id="board-container"></div>
  </div>

  <div id="player-row">
    <div class="pile-wrapper" id="discard-pile-wrapper" title="Discard Pile">
      <div class="deck-card pile-card">
        <div class="deck-count" id="discard-count-badge">0</div>
        <div class="pile-icon-overlay" id="discard-icon-overlay"></div>
      </div>
    </div>
    <div class="pile-wrapper" id="hand-pile-wrapper" title="Hand">
      <div class="deck-card pile-card">
        <div class="deck-count" id="hand-count-badge">0</div>
        <div class="pile-icon-overlay" id="hand-icon-overlay"></div>
      </div>
    </div>
    <div id="rock-icon-wrapper">
      <button id="spirit-board-toggle" title="Open spirit board">&#129704;</button>
      <div id="spirit-energy-badge">0+2</div>
    </div>
    <div id="played-cards-row"></div>
  </div>

  <div id="hint-text">Click a piece on the board to remove one.</div>

  <button id="ready-btn">&#10007; Ready?</button>

  <!-- Blight cascade prompt -->
  <div id="cascade-overlay" class="hidden">
    <div id="cascade-box">
      <div id="cascade-message"></div>
      <div id="cascade-options"></div>
    </div>
  </div>

  <!-- Spirit board panel -->
  <div id="spirit-board-overlay" class="hidden">
    <div id="spirit-board-panel">
      <button id="spirit-board-close">&#10005;</button>
      <h2 id="spirit-board-title">Vital Strength of the Earth</h2>

      <div class="spirit-section">
        <h3>Growth</h3>
        <div id="growth-options" class="growth-options"></div>
      </div>

      <div class="spirit-section">
        <h3>Presence Tracks</h3>
        <div class="track-row-label">Energy</div>
        <div id="energy-track-row" class="track-row"></div>
        <div class="track-row-label">Card Plays</div>
        <div id="cardplay-track-row" class="track-row"></div>
      </div>

      <div class="spirit-section">
        <h3>Innate Powers &amp; Special Rules</h3>
        <div id="innate-powers-list"></div>
      </div>
    </div>
  </div>

  <!-- Hand / Discard panel (shared) -->
  <div id="card-panel-overlay" class="hidden">
    <div id="card-panel">
      <button id="card-panel-close">&#10005;</button>
      <h2 id="card-panel-title">Hand</h2>
      <div id="card-panel-row"></div>
    </div>
  </div>

  <!-- Right-click card zoom -->
  <div id="card-zoom-overlay" class="hidden">
    <div id="card-zoom-panel">
      <button id="card-zoom-close">&#10005;</button>
      <div id="card-zoom-content"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
