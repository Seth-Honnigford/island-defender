<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared/Individual State Test</title>
<style>
  :root {
    --btn-red: #c0392b;
    --btn-red-dark: #922b21;
  }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.3s ease;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background-color: #f4f1ea;
  }
  #counter-display {
    font-size: 4rem;
    font-weight: 700;
    color: #222;
    background: rgba(255,255,255,0.6);
    padding: 8px 32px;
    border-radius: 12px;
    min-width: 120px;
    text-align: center;
  }
  #counter-label {
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    color: #555;
    margin-bottom: -20px;
  }
  #big-button {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: var(--btn-red);
    border: none;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--btn-red-dark), 0 8px 16px rgba(0,0,0,0.2);
    transition: transform 0.05s ease;
  }
  #big-button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--btn-red-dark), 0 4px 8px rgba(0,0,0,0.2);
  }

  /* Color picker modal */
  #picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #picker-box {
    background: white;
    padding: 32px 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  #picker-box h2 {
    margin-top: 0;
    font-size: 1.2rem;
    color: #222;
  }
  #swatches {
    display: flex;
    gap: 14px;
    margin-top: 20px;
  }
  .swatch {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
  }
  .swatch:hover {
    border-color: #333;
  }
  .hidden { display: none; }
</style>
</head>
<body>

  <!-- Color picker shown on load -->
  <div id="picker-overlay">
    <div id="picker-box">
      <h2>Pick your color</h2>
      <div id="swatches">
        <div class="swatch" style="background:#e74c3c" data-color="#e74c3c"></div>
        <div class="swatch" style="background:#3498db" data-color="#3498db"></div>
        <div class="swatch" style="background:#2ecc71" data-color="#2ecc71"></div>
        <div class="swatch" style="background:#f1c40f" data-color="#f1c40f"></div>
        <div class="swatch" style="background:#9b59b6" data-color="#9b59b6"></div>
      </div>
    </div>
  </div>

  <!-- Main game area -->
  <div id="game-area" class="hidden">
    <div id="counter-label">TOTAL CLICKS (SHARED)</div>
    <div id="counter-display">0</div>
    <button id="big-button">CLICK ME</button>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase, ref, onValue, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // TODO: paste your Firebase project config here
    const firebaseConfig = {
      apiKey: "AIzaSyCrvwuA5l3BWNogdXtDBfWpAnue7z79vVo",
      authDomain: "island-defender-83985.firebaseapp.com",
      databaseURL: "https://island-defender-83985-default-rtdb.firebaseio.com",
      projectId: "island-defender-83985",
      storageBucket: "island-defender-83985.firebasestorage.app",
      messagingSenderId: "676196488207",
      appId: "1:676196488207:web:41d3251f23190c4ecdbf7a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const counterRef = ref(db, "sharedCounter");

    // --- Shared state: listen for changes from ANY player ---
    onValue(counterRef, (snapshot) => {
      const value = snapshot.val() || 0;
      document.getElementById("counter-display").textContent = value;
    });

    // --- Shared state: increment for everyone when clicked ---
    document.getElementById("big-button").addEventListener("click", () => {
      runTransaction(counterRef, (currentValue) => (currentValue || 0) + 1);
    });

    // --- Individual state: color picker (local only, not synced) ---
    document.querySelectorAll(".swatch").forEach((swatch) => {
      swatch.addEventListener("click", () => {
        const color = swatch.dataset.color;
        document.body.style.backgroundColor = color;
        document.getElementById("picker-overlay").classList.add("hidden");
        document.getElementById("game-area").classList.remove("hidden");
      });
    });
  </script>
</body>
</html>
